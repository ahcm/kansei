[package]
name = "kansei"
version = "0.0.2"
edition = "2024"
authors = ["Andreas Hauser <andreas@creative-memory.net>"]
description = "Kansei programming language"
license = "EUPL-1.2"
keywords = ["programming", "language"]
repository = "https://github.com/ahcm/kansei"

[workspace]
members = [
    "wasm/plotters",
    "wasm/spectral_norm",
]

[profile.release]
strip = true
#lto = "fat"        # Link Time Optimization: mostly for size benefits
#codegen-units = 1  # Reduce parallelism to allow better optimization
panic = "unwind"   # Keep runtime panic recovery consistent with development builds
opt-level = 3      # Maximize speed (default is 3, but good to be explicit)

[dependencies]
tempfile = "3.27"
directories = "6.0.0"
rustc-hash = "2.1.1"
rustyline = "17.0.2"
smallvec = "1.15.1"
wasmi = { version = "1.0.8", optional = true }
wasmtime = "41.0.1"
wat = "1.243.0"
wasmprinter = "0.243.0"
wit-component = "0.243.0"
wasi-preview1-component-adapter-provider = "=41.0.4"
polars = { version = "0.52.0", default-features = false, features = ["csv"] , optional = true }
clap = { version = "4.5.56", default-features = false, features = ["std"] , optional = true }
serde_json = "1.0.149"
regex = { version = "1.12.2", optional = true }
glob = "0.3.3"
chrono = { version = "0.4.43", default-features = false, features = ["clock"] , optional = true }
notify = "8.2.0"
libc = "0.2.180"
rand = { version = "0.9.2", optional = true }
rayon = "1.11.0"
sha2 = { version = "0.10.9", optional = true }
hmac = { version = "0.12.1", optional = true }
blake3 = { version = "1.8.3", optional = true }
ureq = { version = "3.1.4", default-features = true , optional = true }
csv = { version = "1.4.0", optional = true }
base64 = { version = "0.22.1", optional = true }
uuid = { version = "1.20.0", features = ["v4"] , optional = true }
toml = "0.9.11"
serde_yaml = { version = "0.9.34", optional = true }
flate2 = { version = "1.1.8", default-features = false, features = ["rust_backend"] , optional = true }
image = { version = "0.25.9", default-features = false, features = ["png"] , optional = true }
rusqlite = { version = "0.38.0", features = ["bundled"] , optional = true }
memmap2 = { version = "0.9.9", optional = true }
eframe = { version = "0.33.3", optional = true }
crossterm = { version = "0.29.0", optional = true }
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"], optional = true }
rustls = { version = "0.23.36", optional = true }
webpki-roots = { version = "1.0.5", optional = true }
russh = { version = "0.57.0", optional = true }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "net", "sync", "time", "io-util"], optional = true }

[dev-dependencies]
wasmtime-wasi = { version = "=41.0.4", default-features = false, features = ["p1", "p2"] }

[features]
default = ["std-lib-all"]
std-lib-all = [
    "lib-base64",
    "lib-bytes",
    "lib-clap",
    "lib-crypto",
    "lib-csv",
    "lib-datetime",
    "lib-egui",
    "lib-flate2",
    "lib-http",
    "lib-image",
    "lib-math",
    "lib-mmap",
    "lib-net",
    "lib-path",
    "lib-polars",
    "lib-regex",
    "lib-russh",
    "lib-serde",
    "lib-sqlite",
    "lib-tui",
    "lib-tests",
    "lib-toml",
    "lib-uuid",
    "lib-yaml",
]
lib-base64 = ["dep:base64"]
lib-bytes = []
lib-clap = ["dep:clap"]
lib-crypto = ["dep:rand", "dep:sha2", "dep:hmac", "dep:blake3"]
lib-csv = ["dep:csv"]
lib-datetime = ["dep:chrono"]
lib-egui = ["dep:eframe"]
lib-flate2 = ["dep:flate2", "dep:base64"]
lib-http = ["dep:ureq"]
lib-image = ["dep:image", "dep:base64"]
lib-math = []
lib-mmap = ["dep:memmap2"]
lib-net = ["dep:rustls", "dep:webpki-roots"]
lib-path = []
lib-polars = ["dep:polars"]
lib-regex = ["dep:regex"]
lib-russh = ["dep:russh", "dep:tokio"]
lib-serde = []
lib-sqlite = ["dep:rusqlite", "dep:base64"]
lib-tui = ["dep:crossterm", "dep:ratatui"]
lib-tests = []
lib-toml = ["lib-serde"]
lib-uuid = ["dep:uuid"]
lib-yaml = ["dep:serde_yaml", "lib-serde"]
flate2-zlib = ["lib-flate2", "flate2/zlib"]
flate2-zlib-ng = ["lib-flate2", "flate2/zlib-ng"]
wasmi = ["dep:wasmi"]
egui = ["lib-egui"]
tui = ["lib-tui"]
